name: Build LastWave APK

on:
  push:
    branches: [ sahank29-main ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  pull_request:
    branches: [ sahank29-main ]
    paths-ignore:
      - '**.md'
      - 'Screenshot/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/sahank29-main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage Final APK
        id: prep_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="5.0.0-0.1.1"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building APK for LastWave v$VERSION"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/LastWave-v${VERSION}-release.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/LastWave-v${VERSION}-release.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signature + publish checksum
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDKROOT, skipping signature verification"
          else
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            done
            echo "All APK signatures valid."
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Prepare release description
        if: github.event_name == 'push' && github.ref == 'refs/heads/sahank29-main'
        id: release_meta
        run: |
          VERSION="${{ steps.prep_apk.outputs.version }}"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > changelog_section.md

          {
            echo "## LastWave ${VERSION}"
            echo
            if [ -s changelog_section.md ]; then
              echo "### Changelog"
              echo
              cat changelog_section.md
            else
              echo "- Automated release for commit \`${GITHUB_SHA}\`."
            fi
            echo
            echo "### Artifacts"
            echo
            echo "- APK packages and \`SHA256SUMS.txt\` are attached to this release."
          } > release_body.md

      - name: Create Git tag and GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/sahank29-main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: LastWave v${{ steps.prep_apk.outputs.version }}
          body_path: release_body.md
          files: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
          draft: false
          prerelease: false

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-v${{ steps.prep_apk.outputs.version }}-APK
          path: final_apk/*
          if-no-files-found: error
