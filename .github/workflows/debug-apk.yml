name: Build Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'audio/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - '.github/workflows/debug-apk.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The hosted runner has the Android SDK. Gradle installs the
      # compileSdk platform it needs, as the existing CI already does.
      - name: Show Android SDK configuration
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls -1 "${ANDROID_HOME}/platforms" || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
